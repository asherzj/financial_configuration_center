syntax = "proto3";

package finconfig.control.v1;

import "finconfig/common/v1/common.proto";
import "finconfig/config/v1/config.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/asherzj/financial_configuration_center/gen/go/finconfig/control/v1;controlv1";

service CatalogAdminService {
  rpc CreateCollection(CreateCollectionRequest) returns (CreateCollectionResponse);
  rpc UpdateCollection(UpdateCollectionRequest) returns (UpdateCollectionResponse);
  rpc GetCollection(GetCollectionRequest) returns (GetCollectionResponse);
  rpc ListCollections(ListCollectionsRequest) returns (ListCollectionsResponse);
  rpc CreateSubscription(CreateSubscriptionRequest) returns (CreateSubscriptionResponse);
  rpc UpdateSubscription(UpdateSubscriptionRequest) returns (UpdateSubscriptionResponse);
  rpc ListSubscriptions(ListSubscriptionsRequest) returns (ListSubscriptionsResponse);
  rpc CreateModel(CreateModelRequest) returns (CreateModelResponse);
  rpc UpdateModel(UpdateModelRequest) returns (UpdateModelResponse);
  rpc GetModel(GetModelRequest) returns (GetModelResponse);
  rpc ListModels(ListModelsRequest) returns (ListModelsResponse);
  rpc CreateReleaseTemplate(CreateReleaseTemplateRequest) returns (CreateReleaseTemplateResponse);
  rpc GetReleaseTemplate(GetReleaseTemplateRequest) returns (GetReleaseTemplateResponse);
  rpc ListReleaseTemplates(ListReleaseTemplatesRequest) returns (ListReleaseTemplatesResponse);
}

service ReleaseService {
  rpc CreateReleaseOrder(CreateReleaseOrderRequest) returns (CreateReleaseOrderResponse);
  rpc GetReleaseOrder(GetReleaseOrderRequest) returns (GetReleaseOrderResponse);
  rpc ListReleaseOrders(ListReleaseOrdersRequest) returns (ListReleaseOrdersResponse);
  rpc ActOnReleaseOrder(ActOnReleaseOrderRequest) returns (ActOnReleaseOrderResponse);
  rpc CreateCompensatingRelease(CreateCompensatingReleaseRequest) returns (CreateCompensatingReleaseResponse);
}

service AuditService {
  rpc ListAuditRecords(ListAuditRecordsRequest) returns (ListAuditRecordsResponse);
}

service SensitiveAccessService {
  rpc RevealField(RevealFieldRequest) returns (RevealFieldResponse);
}

service OperationsService {
  rpc ListOutboxEvents(ListOutboxEventsRequest) returns (ListOutboxEventsResponse);
  rpc ReplayOutboxEvent(ReplayOutboxEventRequest) returns (ReplayOutboxEventResponse);
}

message FieldDefinition {
  string name = 1;
  string display_name = 2;
  finconfig.common.v1.FieldType type = 3;
  bool is_required = 4;
  bool sensitive = 5;
  optional string default_value = 6;
  string description = 7;
  int32 display_order = 8;
  repeated finconfig.config.v1.ValidationRule validation_rules = 9;
}

message Collection {
  string name = 1;
  string description = 2;
  repeated FieldDefinition fields = 3;
  repeated string key_fields = 4;
  bool sdk_delivery_enabled = 5;
  int64 schema_version = 6;
  string status = 7;
  int64 config_revision = 8;
  finconfig.common.v1.AuditStamp audit = 9;
}

message CreateCollectionRequest {
  Collection collection = 1;
}

message UpdateCollectionRequest {
  Collection collection = 1;
  int64 expected_collection_revision = 2;
}

message GetCollectionRequest {
  string name = 1;
}

message ListCollectionsRequest {
  finconfig.common.v1.PageRequest page = 1;
}

message CreateCollectionResponse {
  Collection collection = 1;
}

message UpdateCollectionResponse {
  Collection collection = 1;
}

message GetCollectionResponse {
  Collection collection = 1;
}

message ListCollectionsResponse {
  repeated Collection collections = 1;
  finconfig.common.v1.PageResponse page = 2;
}

message Subscription {
  string id = 1;
  string consumer_id = 2;
  string collection = 3;
  string index_name = 4;
  repeated string index_fields = 5;
  string cardinality = 6;
  bool enabled = 7;
  int64 config_revision = 8;
}

message CreateSubscriptionRequest {
  Subscription subscription = 1;
}

message UpdateSubscriptionRequest {
  Subscription subscription = 1;
  int64 expected_subscription_revision = 2;
}

message ListSubscriptionsRequest {
  optional string consumer_id = 1;
  optional string collection = 2;
  finconfig.common.v1.PageRequest page = 3;
}

message CreateSubscriptionResponse {
  Subscription subscription = 1;
}

message UpdateSubscriptionResponse {
  Subscription subscription = 1;
}

message ListSubscriptionsResponse {
  repeated Subscription subscriptions = 1;
  finconfig.common.v1.PageResponse page = 2;
}

message Model {
  string code = 1;
  string name = 2;
  string collection = 3;
  bytes definition_json = 4;
  bool enabled = 5;
  int64 config_revision = 6;
}

message CreateModelRequest {
  Model model = 1;
}

message UpdateModelRequest {
  Model model = 1;
  int64 expected_model_revision = 2;
}

message GetModelRequest {
  string code = 1;
}

message ListModelsRequest {
  optional string collection = 1;
  finconfig.common.v1.PageRequest page = 2;
}

message CreateModelResponse {
  Model model = 1;
}

message UpdateModelResponse {
  Model model = 1;
}

message GetModelResponse {
  Model model = 1;
}

message ListModelsResponse {
  repeated Model models = 1;
  finconfig.common.v1.PageResponse page = 2;
}

message ReleaseStepDefinition {
  string code = 1;
  string name = 2;
  string type = 3;
  int32 sequence = 4;
  repeated string required_roles = 5;
  map<string, string> params = 6;
  string rollback_policy = 7;
  int32 timeout_seconds = 8;
}

message ReleaseTemplate {
  string code = 1;
  string name = 2;
  string model_code = 3;
  string release_type_code = 4;
  int64 version = 5;
  finconfig.common.v1.FinalEffect final_effect = 6;
  bool scheduling_allowed = 7;
  int64 max_schedule_window_seconds = 8;
  repeated ReleaseStepDefinition steps = 9;
  repeated string allowed_roles = 10;
  bool enabled = 11;
}

message CreateReleaseTemplateRequest {
  ReleaseTemplate release_template = 1;
}

message GetReleaseTemplateRequest {
  string code = 1;
  int64 version = 2;
}

message ListReleaseTemplatesRequest {
  optional string model_code = 1;
  finconfig.common.v1.PageRequest page = 2;
}

message CreateReleaseTemplateResponse {
  ReleaseTemplate release_template = 1;
}

message GetReleaseTemplateResponse {
  ReleaseTemplate release_template = 1;
}

message ListReleaseTemplatesResponse {
  repeated ReleaseTemplate release_templates = 1;
  finconfig.common.v1.PageResponse page = 2;
}

message ReleaseItemInput {
  finconfig.common.v1.ChangeAction action = 1;
  map<string, string> base_before = 2;
  map<string, string> effective_before = 3;
  map<string, string> after = 4;
  int64 expected_record_revision = 5;
  int64 expected_collection_revision = 6;
  repeated string preserve_sensitive_fields = 7;
}

message CreateReleaseOrderRequest {
  string idempotency_key = 1;
  string model_code = 2;
  string release_type_code = 3;
  finconfig.common.v1.Scope scope = 4;
  string description = 5;
  repeated ReleaseItemInput items = 6;
  optional google.protobuf.Timestamp effective_from = 7;
  optional google.protobuf.Timestamp effective_until = 8;
}

message ReleaseItem {
  string id = 1;
  int32 position = 2;
  finconfig.common.v1.ChangeAction action = 3;
  string collection = 4;
  string record_key = 5;
  string target = 6;
  string target_description = 7;
  map<string, string> base_before = 8;
  map<string, string> effective_before = 9;
  map<string, string> after = 10;
  int64 expected_record_revision = 11;
  int64 expected_collection_revision = 12;
  string status = 13;
}

message ReleaseStepState {
  string step_code = 1;
  string step_type = 2;
  int32 sequence = 3;
  string status = 4;
  int64 entity_revision = 5;
  optional string error_code = 6;
  repeated ReleaseBucketRange rollout_ranges = 7;
  optional ReleaseCompareResult compare_result = 8;
}

message ReleaseBucketRange {
  int32 start = 1;
  int32 end = 2;
}

message ReleaseCompareResult {
  string expected_digest = 1;
  string actual_digest = 2;
  repeated string diff_keys = 3;
  google.protobuf.Timestamp checked_at = 4;
}

message ReleaseOrder {
  string id = 1;
  string release_number = 2;
  string model_code = 3;
  string release_type_code = 4;
  finconfig.common.v1.Scope scope = 5;
  finconfig.common.v1.ReleaseStatus status = 6;
  string current_step_code = 7;
  string description = 8;
  string compensates_order_id = 9;
  int64 entity_revision = 10;
  google.protobuf.Timestamp created_at = 11;
  string created_by = 12;
  optional google.protobuf.Timestamp completed_at = 13;
}

message ReleaseOrderDetail {
  ReleaseOrder order = 1;
  repeated ReleaseItem items = 2;
  repeated ReleaseStepState steps = 3;
  repeated finconfig.common.v1.ReleaseAction allowed_actions = 4;
}

message CreateReleaseOrderResponse {
  ReleaseOrderDetail detail = 1;
}

message GetReleaseOrderResponse {
  ReleaseOrderDetail detail = 1;
}

message ActOnReleaseOrderResponse {
  ReleaseOrderDetail detail = 1;
}

message CreateCompensatingReleaseResponse {
  ReleaseOrderDetail detail = 1;
}

message GetReleaseOrderRequest {
  string order_id = 1;
}

message ListReleaseOrdersRequest {
  optional string model_code = 1;
  optional finconfig.common.v1.ReleaseStatus status = 2;
  finconfig.common.v1.PageRequest page = 3;
}

message ListReleaseOrdersResponse {
  repeated ReleaseOrder orders = 1;
  finconfig.common.v1.PageResponse page = 2;
}

message ActOnReleaseOrderRequest {
  string order_id = 1;
  string action_request_id = 2;
  int64 expected_order_revision = 3;
  string expected_current_step = 4;
  finconfig.common.v1.ReleaseAction action = 5;
  string comment = 6;
}

message CreateCompensatingReleaseRequest {
  string order_id = 1;
  string idempotency_key = 2;
  string description = 3;
}

message AuditRecord {
  int64 id = 1;
  google.protobuf.Timestamp occurred_at = 2;
  string principal_subject = 3;
  string action = 4;
  string resource_type = 5;
  string resource_id = 6;
  finconfig.common.v1.Scope scope = 7;
  string result = 8;
  string trace_id = 9;
}

message ListAuditRecordsRequest {
  optional string principal_subject = 1;
  optional string resource_type = 2;
  optional string resource_id = 3;
  optional google.protobuf.Timestamp from = 4;
  optional google.protobuf.Timestamp until = 5;
  finconfig.common.v1.PageRequest page = 6;
}

message ListAuditRecordsResponse {
  repeated AuditRecord records = 1;
  finconfig.common.v1.PageResponse page = 2;
}

message RevealFieldRequest {
  string model_code = 1;
  finconfig.common.v1.Scope scope = 2;
  string record_key = 3;
  string field_name = 4;
  int64 expected_record_revision = 5;
  int64 expected_collection_revision = 6;
  int64 expected_model_revision = 7;
  string expected_server_epoch = 8;
  string expected_snapshot_instance = 9;
  uint64 expected_snapshot_generation = 10;
  string reason = 11;
  optional int32 preview_bucket = 12;
}

message RevealFieldResponse {
  string value = 1;
  google.protobuf.Timestamp expires_at = 2;
}

message OutboxEvent {
  string id = 1;
  int64 sequence_no = 2;
  string event_type = 3;
  string status = 4;
  int64 lease_revision = 5;
  int32 attempts = 6;
  google.protobuf.Timestamp next_attempt_at = 7;
  optional string last_error = 8;
}

message ListOutboxEventsRequest {
  optional string status = 1;
  finconfig.common.v1.PageRequest page = 2;
}

message ListOutboxEventsResponse {
  repeated OutboxEvent events = 1;
  finconfig.common.v1.PageResponse page = 2;
}

message ReplayOutboxEventRequest {
  string event_id = 1;
  int64 expected_event_revision = 2;
  string reason = 3;
  string confirmation = 4;
}

message ReplayOutboxEventResponse {
  OutboxEvent event = 1;
}
