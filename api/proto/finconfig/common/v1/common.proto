syntax = "proto3";

package finconfig.common.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/asherzj/financial_configuration_center/gen/go/finconfig/common/v1;commonv1";

enum FieldType {
  FIELD_TYPE_UNSPECIFIED = 0;
  FIELD_TYPE_STRING = 1;
  FIELD_TYPE_INT64 = 2;
  FIELD_TYPE_FLOAT64 = 3;
  FIELD_TYPE_BOOL = 4;
  FIELD_TYPE_TIMESTAMP = 5;
  FIELD_TYPE_JSON = 6;
}

enum UiControlType {
  UI_CONTROL_TYPE_UNSPECIFIED = 0;
  UI_CONTROL_TYPE_INPUT = 1;
  UI_CONTROL_TYPE_SELECT = 2;
  UI_CONTROL_TYPE_TIME = 3;
  UI_CONTROL_TYPE_NUMBER = 4;
  UI_CONTROL_TYPE_BOOLEAN = 5;
  UI_CONTROL_TYPE_TEXTAREA = 6;
  UI_CONTROL_TYPE_JSON = 7;
}

enum FilterOperator {
  FILTER_OPERATOR_UNSPECIFIED = 0;
  FILTER_OPERATOR_EXACT = 1;
  FILTER_OPERATOR_CONTAINS = 2;
  FILTER_OPERATOR_CLOSED_RANGE = 3;
  FILTER_OPERATOR_OPEN_RANGE = 4;
  FILTER_OPERATOR_IN = 5;
  FILTER_OPERATOR_NOT_IN = 6;
}

enum ChangeAction {
  CHANGE_ACTION_UNSPECIFIED = 0;
  CHANGE_ACTION_ADD = 1;
  CHANGE_ACTION_MODIFY = 2;
  CHANGE_ACTION_DELETE = 3;
}

enum QueryPageType {
  QUERY_PAGE_TYPE_UNSPECIFIED = 0;
  QUERY_PAGE_TYPE_ALL = 1;
  QUERY_PAGE_TYPE_ONLY_DATA = 2;
}

enum ReleaseAction {
  RELEASE_ACTION_UNSPECIFIED = 0;
  RELEASE_ACTION_EXECUTE = 1;
  RELEASE_ACTION_ADVANCE = 2;
  RELEASE_ACTION_ROLLBACK = 3;
  RELEASE_ACTION_APPROVE = 4;
  RELEASE_ACTION_REJECT = 5;
}

enum ReleaseStatus {
  RELEASE_STATUS_UNSPECIFIED = 0;
  RELEASE_STATUS_IN_PROGRESS = 1;
  RELEASE_STATUS_SUCCEEDED = 2;
  RELEASE_STATUS_ROLLED_BACK = 3;
  RELEASE_STATUS_REJECTED = 4;
  RELEASE_STATUS_FAILED = 5;
}

enum FinalEffect {
  FINAL_EFFECT_UNSPECIFIED = 0;
  FINAL_EFFECT_BASE_FINAL = 1;
  FINAL_EFFECT_OVERLAY_FINAL = 2;
}

message Scope {
  string region = 1;
  string environment = 2;
  string stage = 3;
}

message Digest {
  string algorithm = 1;
  string value = 2;
}

message SnapshotIdentity {
  string server_epoch = 1;
  string server_instance_id = 2;
  string snapshot_instance = 3;
  uint64 snapshot_generation = 4;
  google.protobuf.Timestamp published_at = 5;
}

message ErrorDetail {
  string code = 1;
  string message = 2;
  optional string field = 3;
  optional string resource_type = 4;
  optional string resource_id = 5;
  optional int64 current_revision = 6;
  optional string trace_id = 7;
}

message PageRequest {
  optional int32 number = 1;
  optional int32 size = 2;
}

message PageResponse {
  int32 number = 1;
  int32 size = 2;
  int64 total_number = 3;
  int64 total_pages = 4;
}

message AuditStamp {
  google.protobuf.Timestamp created_at = 1;
  string created_by = 2;
  google.protobuf.Timestamp updated_at = 3;
  string updated_by = 4;
}
